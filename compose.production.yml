name: cyanyi-drama-prod

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cyanyi}
      POSTGRES_USER: ${POSTGRES_USER:-cyanyi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    image: ghcr.io/sexyahri/cyanyi-drama:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:3456:3000"
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      APP_BASE_URL: https://${DOMAIN:?Set DOMAIN in .env.production}
      APP_SECRET: ${APP_SECRET:?Set APP_SECRET in .env.production}
      DATABASE_URL: postgresql://${POSTGRES_USER:-cyanyi}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}@postgres:5432/${POSTGRES_DB:-cyanyi}?schema=public
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000').then(r => process.exit(r.status < 500 ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  worker:
    image: ghcr.io/sexyahri/cyanyi-drama:latest
    restart: unless-stopped
    command: ["pnpm", "worker"]
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      APP_BASE_URL: https://${DOMAIN:?Set DOMAIN in .env.production}
      APP_SECRET: ${APP_SECRET:?Set APP_SECRET in .env.production}
      DATABASE_URL: postgresql://${POSTGRES_USER:-cyanyi}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}@postgres:5432/${POSTGRES_DB:-cyanyi}?schema=public
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  migrate:
    image: ghcr.io/sexyahri/cyanyi-drama:latest
    profiles: ["tools"]
    restart: "no"
    command: ["pnpm", "exec", "prisma", "migrate", "deploy"]
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      APP_SECRET: ${APP_SECRET:?Set APP_SECRET in .env.production}
      DATABASE_URL: postgresql://${POSTGRES_USER:-cyanyi}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}@postgres:5432/${POSTGRES_DB:-cyanyi}?schema=public
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
