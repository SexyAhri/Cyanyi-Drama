services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: cyanyi
      POSTGRES_USER: cyanyi
      POSTGRES_PASSWORD: cyanyi
    ports:
      - "5432:5432"
    volumes:
      - cyanyi_postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - cyanyi_redis:/data

volumes:
  cyanyi_postgres:
  cyanyi_redis:
