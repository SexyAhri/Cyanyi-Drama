services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: cyanyi
      MYSQL_USER: cyanyi
      MYSQL_PASSWORD: cyanyi
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - cyanyi_mysql:/var/lib/mysql

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - cyanyi_redis:/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - cyanyi_minio:/data

volumes:
  cyanyi_mysql:
  cyanyi_redis:
  cyanyi_minio:
